# OrbStack:  HOST_PORT=7800 docker compose up --build -d   ->  http://127.0.0.1:7800
# The server binds 0.0.0.0 INSIDE the container (OBS_BIND is the opt-in), but the port is published on loopback only.
# Do not change the 127.0.0.1 below. HOST_PORT must stay 7800.
name: observability-lab

services:
  observability-lab:
    restart: unless-stopped
    build: .
    ports:
      - "127.0.0.1:${HOST_PORT:-7800}:7800"
    environment:
      PORT: "7800"
      OBS_BIND: 0.0.0.0
      SHELF_URL: ${SHELF_URL:-http://127.0.0.1:4400}
      LAB_ALLOWED_HOSTS: ${LAB_ALLOWED_HOSTS:-observability-lab.local.ping-devops.com}
      # Start mode. The image sets MODE=mock; this replaces it with OBS_MODE, empty when unset, and an empty MODE means "Real when
      # the Real settings below are usable, else Mock". OBS_MODE=mock or OBS_MODE=real forces one (real is refused if unconfigured).
      MODE: ${OBS_MODE:-}
      # Real mode reads this Loki, read-only, loopback only. Empty = Real stays disabled. With the stack profile, run:
      #   OBS_LOKI_URL=http://127.0.0.1:3100 docker compose --profile stack up -d
      OBS_LOKI_URL: ${OBS_LOKI_URL:-}
      # Privilege SIEM (Real, read-only): passed through from YOUR shell, never written here. Empty PRIVILEGE_SIEM_URL = off.
      # In Docker use PRIVILEGE_SIEM_URL=http://127.0.0.1:9200 with the `siem` profile: the forwarder below makes that the
      # Mac's localhost:9200 (the Elasticsearch port-forward). The lab still accepts only a loopback URL.
      OBS_SEARCH_DEFAULTS: ${OBS_SEARCH_DEFAULTS:-}
      PRIVILEGE_SIEM_URL: ${PRIVILEGE_SIEM_URL:-}
      PRIVILEGE_SIEM_INDEX: ${PRIVILEGE_SIEM_INDEX:-}
      PRIVILEGE_SIEM_READ_APIKEY: ${PRIVILEGE_SIEM_READ_APIKEY:-}
      # Links only (the lab never calls them): the Kibana origin, and the two sibling labs on the Searches tab (loopback only).
      PRIVILEGE_KIBANA_URL: ${PRIVILEGE_KIBANA_URL:-}
      PRIVILEGE_LOGGING_LAB_URL: ${PRIVILEGE_LOGGING_LAB_URL:-}
      FIELD_NOTES_URL: ${FIELD_NOTES_URL:-}
      # The port-forward hints: your kube context and namespace (hints only, the lab never runs kubectl). Empty = <your-context>/<your-namespace>.
      OBS_KUBE_CONTEXT: ${OBS_KUBE_CONTEXT:-}
      OBS_KUBE_NAMESPACE: ${OBS_KUBE_NAMESPACE:-}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7800/api/health').then(r=>r.json()).then(j=>process.exit(j.schema==='demo-health/1'&&j.state==='ready'?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      start_period: 5s
      start_interval: 2s
      timeout: 5s
      retries: 3

  # ── The lab's own log stack (profile `stack`; off by default, the Mac is short on memory) ──────────────────
  # Loki and Alloy share the lab's network namespace, so Loki is 127.0.0.1:3100 for the lab (which accepts only
  # loopback Loki URLs) and NO extra host port is published. Nothing here has an outbound network use: Loki
  # analytics and Alloy reporting are off.
  loki:
    restart: unless-stopped
    image: grafana/loki:3.3.2
    profiles: ["stack"]
    network_mode: "service:observability-lab"
    depends_on: [observability-lab]
    command: ["-config.file=/etc/stack/loki.yaml"]
    volumes:
      - ./stack:/etc/stack:ro
    tmpfs: ["/tmp"]
    mem_limit: 512m
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Reads the lab-proxy's stdout through the Docker socket, mounted read-only (as AI-DEMO2's collector does):
  # it can list containers and read their logs, nothing else.
  alloy:
    restart: unless-stopped
    image: grafana/alloy:v1.19.2
    profiles: ["stack"]
    network_mode: "service:observability-lab"
    depends_on: [loki]
    command: ["run", "--server.http.listen-addr=127.0.0.1:12345", "--storage.path=/tmp/alloy", "--disable-reporting", "/etc/stack/alloy.alloy"]
    volumes:
      - ./stack:/etc/stack:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    tmpfs: ["/tmp"]
    mem_limit: 256m
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # ── Privilege SIEM forwarder (profile `siem`) ─────────────────────────────────────────────────────────────────
  # The lab reads the SIEM only from a loopback URL, and the container's loopback is not the Mac's. This shares the lab's network
  # namespace and listens on 127.0.0.1:9200 there, passing bytes to the Mac's localhost:9200 (OrbStack's host.docker.internal), where
  # the Elasticsearch port-forward runs. A plain TCP relay with no options for logging (no -v/-d): the key passes through in the request
  # header like any HTTP hop and is never printed. It publishes no host port.
  siem-forwarder:
    restart: unless-stopped
    image: alpine/socat:1.8.1.1
    profiles: ["siem"]
    network_mode: "service:observability-lab"
    depends_on: [observability-lab]
    command: ["TCP-LISTEN:9200,bind=127.0.0.1,fork,reuseaddr", "TCP:host.docker.internal:9200"]
    user: "65534:65534"
    mem_limit: 32m
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # The browser driver: `docker compose --profile drive run --rm driver`. It visits the labs through the lab-proxy
  # (GET only), so the proxy logs real requests for Alloy to ship. local.ping-devops.com is mapped to the host.
  driver:
    build:
      context: .
      dockerfile: driver/Dockerfile
    profiles: ["drive"]
    extra_hosts:
      - "local.ping-devops.com:host-gateway"
    environment:
      DRIVE_ROUNDS: ${DRIVE_ROUNDS:-1}
      DRIVE_LABS: ${DRIVE_LABS:-}
    ipc: host
    tmpfs: ["/tmp"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
